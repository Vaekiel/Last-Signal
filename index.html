<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dernier Signal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Dernier Signal : un jeu incrémental de survie spatiale en français. Récupérez des débris, maintenez l'équipage en vie et envoyez le dernier signal vers la Terre.">
<meta name="theme-color" content="#050914">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="logo frame hot">
      <div class="logo-title">DERNIER<br>SIGNAL</div>
      <div class="logo-mark" aria-hidden="true"><i></i></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sections du jeu"></nav>
    <div class="side-stats frame" id="side-stats"></div>
  </aside>

  <header class="top">
    <div class="mobile-logo" aria-hidden="true">DERNIER SIGNAL</div>
    <div class="res-bar" id="res-bar" aria-label="Ressources"></div>
    <div class="top-tools">
      <button class="tool-btn frame" id="mail-btn" type="button" aria-label="Transmissions"><span class="badge" hidden></span></button>
      <button class="tool-btn frame" id="opt-btn" type="button" aria-label="Options"></button>
      <button class="sector-card frame" id="sector-card" type="button" aria-label="Secteur actuel"></button>
    </div>
  </header>

  <main class="main" id="main"></main>
  <aside class="right" id="right" aria-label="État du vaisseau"></aside>
</div>

<nav class="mobile-nav" id="mobile-nav" aria-label="Sections du jeu"></nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-wrap" id="modal" hidden>
  <div class="modal frame hot" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal-box"></div>
</div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/sprites.js"></script>
<script src="js/scene.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
